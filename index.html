<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --gold-dim: #7a5f2a;
    --burgundy: #5c0e20;
    --burgundy-deep: #3a0812;
    --bg: #0d0205;
    --bg2: #160409;
    --text: #f0e8d8;
    --text-muted: #9a7a6a;
    --border: rgba(201,168,76,0.18);
  }

  html { height: 100%; }

  body {
    min-height: 100%;
    background: var(--bg);
    font-family: 'Montserrat', sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(92,14,32,0.5) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(92,14,32,0.25) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 3rem 1.5rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 2.5rem; }

  .logo-ring {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    padding: 3px;
    margin: 0 auto 1.25rem;
    animation: fadeDown 0.8s ease both;
  }

  .logo-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--burgundy-deep);
    border: 1px solid var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-inner svg { width: 58px; height: 58px; }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1.2;
    animation: fadeDown 0.8s 0.1s ease both;
  }

  .brand-sub {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 6px;
    animation: fadeDown 0.8s 0.15s ease both;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 1rem 0;
    animation: fadeDown 0.8s 0.2s ease both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .divider::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .divider-diamond {
    width: 5px; height: 5px;
    background: var(--gold-dim);
    transform: rotate(45deg);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    animation: fadeDown 0.8s 0.25s ease both;
  }

  /* ── LINKS ── */
  .links { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 0.5rem; }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(92,14,32,0.25) 0%, rgba(22,4,9,0.8) 100%);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s, transform 0.2s, background 0.2s;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .link-card:hover {
    border-color: rgba(201,168,76,0.5);
    background: linear-gradient(135deg, rgba(92,14,32,0.45) 0%, rgba(22,4,9,0.9) 100%);
    transform: translateY(-2px);
  }

  .link-card:nth-child(1) { animation-delay: 0.3s; }
  .link-card:nth-child(2) { animation-delay: 0.4s; }
  .link-card:nth-child(3) { animation-delay: 0.5s; }
  .link-card:nth-child(4) { animation-delay: 0.6s; }

  .link-icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: rgba(201,168,76,0.08);
    border: 0.5px solid rgba(201,168,76,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .link-icon svg { width: 20px; height: 20px; }

  .link-info { flex: 1; }

  .link-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 0.5px;
  }

  .link-desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .link-arrow {
    font-size: 16px;
    color: var(--gold-dim);
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 2.5rem;
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s ease forwards;
  }

  .footer-divider {
    display: flex; align-items: center; gap: 8px; margin-bottom: 1rem;
  }
  .footer-divider::before, .footer-divider::after {
    content: ''; flex: 1; height: 0.5px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.15));
  }
  .footer-divider::after { background: linear-gradient(90deg, rgba(201,168,76,0.15), transparent); }
  .footer-dot { width: 3px; height: 3px; background: var(--gold-dim); border-radius: 50%; }

  .footer-text {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
